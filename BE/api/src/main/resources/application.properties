spring.application.name=api

spring.config.import=optional:classpath:application-secret.properties

# Database
spring.datasource.url=jdbc:mysql://localhost:3306/wearther?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Jackson - 날짜를 ISO 문자열로 직렬화 (기본값은 배열 형식)
spring.jackson.serialization.write-dates-as-timestamps=false

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# File upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# JWT (24h)
jwt.expiration=86400000

# OpenWeatherMap (key is in application-secret.properties)
openweather.api.key=

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Server
server.port=8080
